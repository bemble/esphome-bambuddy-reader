lvgl:
  pages:
    - id: page_idle
      styles: style_page
      widgets:
        # Icône statut Bambuddy (vert = configuré, gris = non configuré)
        - label:
            id: lbl_sync_icon
            x: 4
            y: 4
            text: "\U000F04E8"
            text_color: 0x555555
            text_font: font_large
        - arc:
            id: arc_large
            align: CENTER
            y: -40
            width: 100
            height: 100
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_color: 0x3D6B3D
            arc_opa: TRANSP
            indicator:
              arc_color: 0x3D6B3D
              arc_width: 3
            value: 100
            min_value: 0
            max_value: 100
            adjustable: false
            clickable: false
            scrollbar_mode: "OFF"
        - arc:
            id: arc_medium
            align: CENTER
            y: -40
            width: 72
            height: 72
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_color: 0x4A8A4A
            arc_opa: TRANSP
            indicator:
              arc_color: 0x4A8A4A
              arc_width: 3
            value: 100
            min_value: 0
            max_value: 100
            adjustable: false
            clickable: false
            scrollbar_mode: "OFF"
        - arc:
            id: arc_small
            align: CENTER
            y: -40
            width: 48
            height: 48
            start_angle: 210
            end_angle: 330
            arc_width: 3
            arc_color: 0x5AAA5A
            arc_opa: TRANSP
            indicator:
              arc_color: 0x5AAA5A
              arc_width: 3
            value: 100
            min_value: 0
            max_value: 100
            adjustable: false
            clickable: false
            scrollbar_mode: "OFF"
        - obj:
            align: CENTER
            y: -40
            width: 20
            height: 20
            radius: 10
            bg_color: 0x00AE42
            bg_opa: COVER
            border_width: 0
            scrollbar_mode: "OFF"
        - label:
            align: CENTER
            y: 25
            width: 220
            text: "${lng_scan_prompt}"
            styles: style_text_primary
        - label:
            align: CENTER
            y: 55
            width: 220
            text: "${lng_waiting}"
            styles: style_text_secondary
        - label:
            id: error_label
            align: BOTTOM_MID
            y: -50
            text: ""
            text_color: 0xFF4444
            text_font: font_medium
        - label:
            align: BOTTOM_MID
            y: -10
            text: "BAMBUBUDDY READER"
            text_color: 0x555555
            text_font: font_tiny